<p style="margin: 0; font-weight: 700; color: #0F3C65">Dear Hiring Team,</p>
<p style="margin: 0">I’m Damini, a recent Master of Data Science graduate from RMIT University, and I love the moment when a messy dataset finally starts telling a clear story. I’m looking for an entry-level data and analytics role where I can do that every day, and help a team make better decisions because of it.</p>
<p style="margin: 0">My Master’s gave me an end-to-end toolkit, and I’ve put it to work. In my Olist project I designed a SQL schema over 99,441 real e-commerce orders, built cohort and RFM analyses, and compared logistic regression with XGBoost to predict which customers come back, using PR-AUC and SHAP so the results stayed honest and explainable. Then I turned it into a Power BI dashboard people could actually use. I’ve also forecast Australian dwelling approvals in R with a SARIMA + GARCH model on 513 months of ABS data, and, in a team of three, led the serverless Lambda build of an AWS web app.</p>
<p style="margin: 0">I’ve learned how data work happens with real people, too. In my industry capstone with Xolvit, I led the frontend for an AI presentation-coaching tool, wrote the project proposal and co-led the final report, coordinating across a five-person team and our industry and academic supervisors over ten weeks.</p>
<p style="margin: 0">Outside uni, I’ve spent two years on the floor at Costco Moorabbin: first demonstrating products through CDS, and now as a Member Service Assistant. It’s taught me things a degree can’t: how customers really behave, how to stay accurate when it’s busy, and how to report the numbers managers rely on, from daily sample counts to half-hourly door counts. Add event work at the Australian Open and Grand Prix and volunteering with RMIT’s Kirrip Program, and you’ll find someone comfortable with people, pressure and data.</p>
<p style="margin: 0">I’m a fast learner who loves a challenge, and I bring curiosity, care and a designer’s eye to everything I build. I’d love the chance to talk about how I could help your team. Thank you for your time.</p>
