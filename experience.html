<script>
class Component extends DCLogic {
  componentDidMount() {
    this.timer = setInterval(() => {
      const s = this.state || {};
      if (!s.riding) return;
      const i = this.cur();
      if (i >= 7) { this.setState({ riding: false }); return; }
      this.setState({ idx: i + 1 });
    }, 2600);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  cur() {
    const s = this.state || {};
    if (typeof s.idx === 'number') return s.idx;
    const p = (this.props && this.props.startStop) || 7;
    return Math.max(0, Math.min(7, p - 1));
  }
  renderVals() {
    const s = this.state || {};
    const idx = this.cur();
    const xs = [110, 284, 459, 633, 807, 981, 1156, 1330];
    const colors = ["#E8B931", "#0F3C65", "#7DB27A", "#7DB27A", "#0F3C65", "#E8B931", "#0F3C65", "#E97F7F"];
    const go = (i) => this.setState({ idx: Math.max(0, Math.min(7, i)), riding: false });
    const out = {};
    for (let i = 0; i < 8; i++) {
      const on = i === idx;
      out['s' + i] = { bg: on ? colors[i] : '#FFFDF5', tf: on ? 'scale(1.18)' : 'none', fw: on ? 800 : 600,
        pressed: on ? 'true' : 'false', pick: () => go(i) };
      out['t' + i] = on;
    }
    return Object.assign(out, {
      tramX: xs[idx] + 'px',
      prev: () => go(idx - 1),
      next: () => go(idx + 1),
      ride: () => s.riding ? this.setState({ riding: false }) : this.setState({ idx: 0, riding: true }),
      rideLabel: s.riding ? '■ Stop the ride' : '▶ Ride the whole line',
      copyEmail: () => { const ok = () => this.setState({ copied: 'yes' }); const no = () => this.setState({ copied: 'no' }); try { navigator.clipboard.writeText('Daminiwadekar19@gmail.com').then(ok, no); } catch (e) { no(); } },
      copyLabel: s.copied === 'yes' ? 'Copied!' : s.copied === 'no' ? 'Daminiwadekar19@gmail.com' : 'Copy my email'
    });
  }
}
DCBoot(Component);
</script>
