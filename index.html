      const p = this.props || {};
      if (s.auto === false || p.autoplay === false) return;
      try { if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return; } catch (e) {}
      this.setState({ idx: (this.curIdx() + 1) % 4, spot: null });
    }, 5000);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  curIdx() {
    const s = this.state || {};
    const p = this.props || {};
    const order = ['Analyst', 'Foodie', 'Designer', 'Social'];
    if (typeof s.idx === 'number') return s.idx;
    const i = order.indexOf(p.startMode ?? 'Analyst');
    return i < 0 ? 0 : i;
  }
  renderVals() {
    const s = this.state || {};
    const p = this.props || {};
    const idx = this.curIdx();
    const names = ['The Analyst', 'The Foodie', 'The Designer', 'The Social Butterfly'];
    const lines = [
      'Right now: turning messy data into clear, useful stories.',
      'Show me a dish I haven’t tried, then I’ll go home and cook it.',
      'I care how a dashboard looks, not just what it says.',
      'Proud extrovert. Come say hi, I love meeting new people!'
    ];
    const spots = {
      a0: [0, 'Power BI dashboards: I built one showing cohort retention, RFM segments and risk scores across 99,441 Olist orders.'],
      a1: [0, 'Forecasting: a SARIMA + GARCH model in R, built on 513 months of ABS dwelling-approvals data.'],
      a2: [0, 'SQL is my home base: schemas, window functions and cohort queries in SQLite, MySQL and PostgreSQL.'],
      f0: [1, 'New dish, new flavour, maybe a new favourite. I’m always up for trying something different.'],
      f1: [1, 'Trying new cuisines is one of my favourite things to do.'],
      f2: [1, 'My kitchen travels the world: Indian, Greek, Italian and Mexican are my favourites to cook. Ask me for a recipe!'],
      d0: [2, 'My Bachelor’s was in Data Management & Visual Insights. Design is how data gets understood.'],
      d1: [2, 'I sketch before I build. This portfolio started as a moodboard of references.'],
      d2: [2, 'Colour, layout and type: small design choices make data easier to read.'],
      s0: [3, 'Waving hello: I genuinely love meeting new people.'],
      s1: [3, 'Event staff at the Australian Open and Australian Grand Prix, keeping big crowds moving with a smile.'],
      s2: [3, 'Volunteering with RMIT’s Kirrip Program and Orientation, helping new students feel at home.']
    };
    const go = (i) => this.setState({ idx: ((i % 4) + 4) % 4, auto: false, spot: null });
    const slots = [
      { tf: 'translate(0px, 10px) rotate(-1deg) scale(1.12)', z: 4 },
      { tf: 'translate(112px, -18px) rotate(10deg) scale(0.92)', z: 3 },
      { tf: 'translate(0px, -52px) rotate(3deg) scale(0.86)', z: 1 },
      { tf: 'translate(-112px, -18px) rotate(-11deg) scale(0.92)', z: 2 }
    ];
    const card = (i) => {
      const slot = (i - idx + 4) % 4;
      return { tf: slots[slot].tf, z: slots[slot].z, front: slot === 0, back: slot !== 0, pick: () => go(i) };
    };
    const pill = (i) => {
      const on = idx === i;
      return { bg: on ? '#0F3C65' : 'transparent', fg: on ? '#FFF2BA' : '#0F3C65', pressed: on ? 'true' : 'false', pick: () => go(i) };
    };
    const activeSpot = s.spot && spots[s.spot] && spots[s.spot][0] === idx ? s.spot : null;
    const sp = {};
    Object.keys(spots).forEach((k) => {
      const on = activeSpot === k;
      sp[k] = {
        bg: on ? '#0F3C65' : '#E8B931',
        fg: on ? '#FFF2BA' : '#0F3C65',
        pressed: on ? 'true' : 'false',
        pick: () => this.setState({ spot: k, auto: false })
      };
    });
    const autoOn = s.auto !== false && p.autoplay !== false;
    return {
      copyEmail: () => { const ok = () => this.setState({ copied: 'yes' }); const no = () => this.setState({ copied: 'no' }); try { navigator.clipboard.writeText('Daminiwadekar19@gmail.com').then(ok, no); } catch (e) { no(); } },
      copyLabel: s.copied === 'yes' ? 'Copied!' : s.copied === 'no' ? 'Daminiwadekar19@gmail.com' : 'Copy my email',
      cA: card(0), cF: card(1), cD: card(2), cS: card(3),
      pA: pill(0), pF: pill(1), pD: pill(2), pS: pill(3),
      sp: sp,
      prev: () => go(idx - 1),
      next: () => go(idx + 1),
      counter: '0' + (idx + 1) + ' / 04 · ' + names[idx].replace('The ', '').toUpperCase(),
      bubble: activeSpot ? spots[activeSpot][1] : lines[idx],
      bubbleTag: activeSpot ? 'YOU FOUND ONE' : 'TAP THE SPARKLES ON MY PICTURE',
      autoLabel: autoOn ? 'Pause the slideshow' : 'Play the slideshow',
      toggleAuto: () => this.setState({ auto: !autoOn }),
      c0: this.cardFlip(0), c1: this.cardFlip(1), c2: this.cardFlip(2), c3: this.cardFlip(3), c4: this.cardFlip(4), c5: this.cardFlip(5)
    };
  }
  cardFlip(i) {
    const s = this.state || {};
    const open = s.open || {};
    const backs = ['#0F3C65', '#4B2E21', '#0F3C65', '#4B2E21', '#0F3C65', '#4B2E21'];
    const isOpen = !!open[i];
    return {
      open: isOpen,
      closed: !isOpen,
      pressed: isOpen ? 'true' : 'false',
      bg: isOpen ? backs[i] : '#FFF2BA',
      fg: isOpen ? '#FFF2BA' : '#0F3C65',
      toggle: () => {
        const cur = (this.state && this.state.open) || {};
        this.setState({ open: Object.assign({}, cur, { [i]: !cur[i] }) });
      }
    };
  }
}
DCBoot(Component);
</script>
