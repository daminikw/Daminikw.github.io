<script>
class Component extends DCLogic {
  segs() { return ["Hi, I’m Damini.\nHere are four problems I’ve solved with data:", "PresX: teaching an AI coach to watch presentations", "Olist: finding the 1.3% of shoppers who come back", "One music app, three AWS architectures", "Forecasting Australia’s monthly dwelling approvals", "Pick one and I’ll tell you the whole story."]; }
  total() { return this.segs().reduce((a, s) => a + s.length, 0); }
  componentDidMount() {
    let reduce = false;
    try { reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    if (reduce) { this.setState({ n: this.total() }); }
    const tick = () => {
      const s = this.state || {};
      const n = s.n || 0;
      if (n < this.total()) this.setState({ n: n + 1 });
      const sp = (this.props && this.props.typingSpeed) || 32;
      const ch = this.flat()[n] || '';
      this.timer = setTimeout(tick, ch === '\n' ? sp * 8 : sp);
    };
    this.timer = setTimeout(tick, 500);
  }
  componentWillUnmount() { clearTimeout(this.timer); }
  flat() { return this.segs().join(''); }
  pick(i) {
    this.setState({ sel: i });
    setTimeout(() => {
      try { const el = document.getElementById('casefile'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {}
    }, 60);
  }
  renderVals() {
    const s = this.state || {};
    const segs = this.segs();
    const total = this.total();
    const n = Math.min(s.n || 0, total);
    const done = n >= total;
    const sel = s.sel || 0;
    let start = 0;
    const out = {};
    segs.forEach((t, i) => {
      const vis = Math.max(0, Math.min(t.length, n - start));
      const typing = n >= start && n < start + t.length;
      out['s' + i] = {
        text: t.slice(0, vis),
        started: n > start || i === 0,
        cur: typing || (done && i === segs.length - 1),
        pick: () => this.pick(i),
        pressed: sel === i ? 'true' : 'false',
        bg: sel === i ? '#FFF2BA' : 'transparent'
      };
      start += t.length;
    });
    const go = (d) => { const cur = sel || 1; this.setState({ sel: ((cur - 1 + d + 4) % 4) + 1 }); };
    return Object.assign(out, {
      copyEmail: () => { const ok = () => this.setState({ copied: 'yes' }); const no = () => this.setState({ copied: 'no' }); try { navigator.clipboard.writeText('Daminiwadekar19@gmail.com').then(ok, no); } catch (e) { no(); } },
      copyLabel: s.copied === 'yes' ? 'Copied!' : s.copied === 'no' ? 'Daminiwadekar19@gmail.com' : 'Copy my email',
      done: done,
      notDone: !done,
      pointer: done ? 'pointer' : 'default',
      strike: !done && n % 2 === 0 && n > 0 ? 'inline' : 'none',
      progress: Math.round((n / total) * 100) + '%',
      status: done ? 'READY: PICK A PROJECT' : 'TYPING… ' + Math.round((n / total) * 100) + '%',
      statusDot: done ? '#3E8E4E' : '#E8B931',
      skip: () => this.setState({ n: total }),
      retype: () => this.setState({ n: 0, sel: 0 }),
      none: !sel,
      d1: sel === 1, d2: sel === 2, d3: sel === 3, d4: sel === 4,
      prevP: () => go(-1),
      nextP: () => go(1)
    });
  }
}
DCBoot(Component);
</script>
